# 本地免安装开发配置：使用 H2 文件数据库（PostgreSQL 兼容模式）
spring:
  datasource:
    url: jdbc:h2:file:./data/campus_library;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console
  flyway:
    enabled: true
    locations: classpath:db/migration/h2
