services:
  postgres:
    image: postgres:16-alpine
    container_name: campus-library-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-campus_library}
      POSTGRES_USER: ${DB_USER:-campus_library}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-campus_library_dev}
      TZ: Asia/Shanghai
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-campus_library} -d ${DB_NAME:-campus_library}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
